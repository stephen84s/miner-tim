# CI for MinerTim — a CLI-only, pure-Rust Monero miner (root crate at repo root).
#
# This workflow is the x86_64 Linux half of CI: it is a genuine regression guard
# for the interpreter, the Stratum client and everything outside the JIT, and it
# says *nothing* about emitted ARM64 — on x86_64 `randomx::jit` is cfg'd out of
# the build entirely (`src/randomx/mod.rs`). The aarch64 JIT is gated by
# `.github/workflows/jit.yml`, which is the reason this project moved to GitHub
# at all (issue #9); it runs on separate runners so a slow full suite here does
# not delay the JIT verdict, and vice versa.
#
# Ported from `.gitlab-ci.yml`'s `rust:lint`, `rust:audit` and `rust:test`.
# NOT ported (deliberately, not an oversight): the `release` job that creates a
# GitLab Release on a `v*` tag. The release flow — `RELEASING.md`, `make
# release` and that job — is a separate checklist item in issue #9 and needs
# decisions (and credentials) that are out of scope for the workflow migration.

name: CI

on:
  # Deliberately NOT `push: branches: [main]`. `main` is protected with
  # "require branches to be up to date before merging", so a PR's head already
  # contains the latest main and its run validates exactly the content that
  # lands. Re-running on the merge commit tests an identical tree and costs a
  # second full pass — measured at **29.5 minutes** of runner time across the
  # five jobs (jit-macos 13.4, jit-linux-arm 11.7, test 4.0, audit 0.2,
  # lint 0.2; mean of 3 completed runs each). The repo is public, so those are
  # free minutes: what this saves is wall-clock and queue time, not money.
  #
  # `workflow_dispatch` stays, so main can still be checked on demand — after a
  # dependency bump, or if branch protection is ever relaxed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only. NOT unconditional: `workflow_dispatch` sets
  # `github.ref` to `refs/heads/main`, so two manual dispatches of main share
  # this group and the second would silently kill the first — and a manual
  # dispatch is precisely the mitigation for main no longer having push runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Matches `.gitlab-ci.yml`'s RUST_VERSION. The JIT is compiler-sensitive and
  # every recorded verification result on this repo used this exact toolchain.
  RUST_VERSION: "1.97.1"
  CARGO_TERM_COLOR: always
  # Incremental artifacts are large, per-machine and worthless in CI, where each
  # job starts from a restored cache rather than a warm working tree.
  CARGO_INCREMENTAL: "0"
  # Bump to invalidate every cache in this workflow by hand (a poisoned or
  # merely suspect cache should be cheap to discard).
  CACHE_EPOCH: v1

jobs:
  # ---------------------------------------------------------------------------
  # Lint — clippy with warnings as errors
  # ---------------------------------------------------------------------------
  lint:
    name: lint (clippy, x86_64 linux)
    # Pinned, not `ubuntu-latest`: the image's core count drives libtest's
    # default --test-threads, which drives peak RSS (issue #7). A silent image
    # bump should not be able to change this pipeline's memory profile.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          rustc --version
          cargo clippy --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ env.CACHE_EPOCH }}-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ env.CACHE_EPOCH }}-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Cache target/
        uses: actions/cache@v4
        with:
          path: target
          # The key carries the job, the toolchain and Cargo.lock. Sharing one
          # target/ key between jobs would have them race to save and restore
          # each other's profile; carrying the toolchain means a Rust upgrade
          # starts cold rather than reusing artifacts built by another rustc.
          key: ${{ env.CACHE_EPOCH }}-target-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ env.CACHE_EPOCH }}-target-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      # No `cargo fmt --check` gate, and this is a decision rather than an
      # omission (inherited verbatim in spirit from `.gitlab-ci.yml`): the
      # RandomX/JIT sources use intentional custom formatting — aligned emitter
      # comments, compact literals — that aids auditing against the reference
      # implementation and does not match rustfmt defaults. A fmt gate would
      # either be permanently red or would destroy that alignment.
      #
      # --all-targets compiles lib, bin, tests and benches; -D warnings turns
      # any clippy or rustc warning into a hard failure.
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # Dependency vulnerability scan — RustSec advisory database
  # ---------------------------------------------------------------------------
  audit:
    name: audit (cargo-audit / RustSec)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version

      # No target/ cache here: this job never builds the crate, only cargo-audit
      # and the advisory database. The advisory DB is cached for speed but is
      # refreshed by `cargo audit` on every run, so a cache hit cannot make the
      # scan stale — it only avoids re-cloning ~100 MB of git history.
      - name: Cache cargo-audit and the advisory DB
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/advisory-db
          key: ${{ env.CACHE_EPOCH }}-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ env.CACHE_EPOCH }}-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Install cargo-audit (if the cache did not supply it)
        # Keep the existence test. A plain `cargo install` over a cached binary
        # errors out ("binary already exists in destination") rather than
        # no-opping, which failed this job on every cached run under GitLab.
        # (The GitLab version additionally had to fight a redirected CARGO_HOME
        # that PATH did not include; that workaround is not needed here, because
        # this workflow leaves CARGO_HOME at its default and the runner already
        # has ~/.cargo/bin on PATH.)
        run: |
          set -euo pipefail
          test -x "$HOME/.cargo/bin/cargo-audit" || cargo install cargo-audit --locked
          cargo audit --version

      # Scans Cargo.lock against https://rustsec.org advisories. Non-zero exit
      # on any advisory, which fails the workflow.
      - name: cargo audit
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Unit tests — the interpreter-path regression guard (release, for speed)
  # ---------------------------------------------------------------------------
  test:
    name: test (cargo test --release, x86_64 linux)
    runs-on: ubuntu-24.04
    # Took ~19 minutes on GitLab's x86_64 runners; measures **4.0 minutes** here
    # (mean of 3 completed runs). 1h is inherited head-room for a cold cache, not
    # an expectation — do not read the timeout as an estimate of the runtime.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ env.CACHE_EPOCH }}-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ env.CACHE_EPOCH }}-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Cache target/
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ env.CACHE_EPOCH }}-target-test-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ env.CACHE_EPOCH }}-target-test-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      # No --test-threads cap here, unlike the macOS JIT gate: this runner has
      # 16 GB against the 6.23 GB measured at 12 threads (issue #7), and it runs
      # at 4. The cap exists for the 7 GB macos-14 box, not as house style.
      #
      # --locked was added on top of the GitLab command: it fails if the build
      # would rewrite Cargo.lock, so CI tests the dependency set that is
      # committed rather than one resolved on the fly.
      - name: cargo test --release
        run: cargo test --release --locked
