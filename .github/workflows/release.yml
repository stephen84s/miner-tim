# Release — fires on a `v*` tag and creates the GitHub Release as a DRAFT.
#
# **This job owns the Release entry; the human owns the assets.** That split is
# the fix for GitHub #11, where this workflow and RELEASING.md both ran
# `gh release create` for the same tag: pushing the tag fired this job, and the
# documented next step then told the operator to create the same release by
# hand, which fails because it already exists.
#
# Draft, not published, for two reasons. A published-but-empty release is worse
# than no release — someone can find it and download nothing. And a draft is
# visible only to users with push access. Note what that does and does not
# hide: the **tag is public immediately**; the draft keeps only the empty
# release out of view. RELEASING.md's final step attaches the tarball and flips
# the draft to published.
#
# The existence check below makes a re-run safe, at the cost of never noticing
# an abandoned draft from a failed attempt — RELEASING.md says how to clean one
# up, because nothing here will.
#
# It creates the release, it does NOT build the binary. On GitLab that was
# forced: the shared runners were x86_64 Linux and physically could not produce
# an aarch64-apple-darwin binary. GitHub's `macos-14` runner is Apple Silicon
# and *could* run `make dist` end to end. Automating it remains a real option
# needing a decision about reproducibility and about whether an unsigned
# CI-built binary should carry the project's name. Until then the build is
# local and this job just opens the drawer to put it in.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: create draft GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --draft: see the header. The operator attaches the tarball and
          # publishes; until then this is invisible to the public.
          # Idempotent: a re-run on the same tag must not fail the workflow.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — leaving it alone"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "MinerTim $GITHUB_REF_NAME" \
            --notes 'Draft. The macOS arm64 binary (`minertim-<ver>-macos-arm64.tar.gz` + `SHA256SUMS`) is built locally with `make dist`, attached with `gh release upload`, and this draft is then published — see RELEASING.md.'
