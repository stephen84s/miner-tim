# CI for MinerTim — a CLI-only, pure-Rust Monero miner (root crate at repo root).
#
# GitLab shared runners are x86_64 Linux, so CI exercises the interpreter path
# only. The shipping artifact is an aarch64-apple-darwin binary built locally via
# `make build`; the aarch64 JIT is compiled by every local build and its
# correctness is validated on real Apple Silicon by `make test`.

stages:
  - check
  - test
  - release

variables:
  RUST_VERSION: "1.97.1"
  CARGO_TERM_COLOR: "always"
  # Keep cargo's state inside the project so it can be cached between jobs.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  image: rust:${RUST_VERSION}
  cache:
    key: cargo-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/advisory-db/
      - target/

# ---------------------------------------------------------------------------
# Lint — formatting, clippy (warnings are errors), and an aarch64 JIT typecheck
# ---------------------------------------------------------------------------
rust:lint:
  stage: check
  before_script:
    - rustup component add clippy
  script:
    # No `cargo fmt --check` gate: the RandomX/JIT sources use intentional
    # custom formatting (aligned emitter comments, compact literals) that aids
    # auditing against the reference implementation and does not match rustfmt
    # defaults. --all-targets compiles lib, bin, tests and benches; -D warnings
    # turns any clippy or rustc warning into a hard failure.
    - cargo clippy --all-targets -- -D warnings

# ---------------------------------------------------------------------------
# Dependency vulnerability scan — RustSec advisory database
# ---------------------------------------------------------------------------
rust:audit:
  stage: check
  before_script:
    - cargo install cargo-audit --locked
  script:
    # Scans Cargo.lock against https://rustsec.org advisories.
    - cargo audit

# ---------------------------------------------------------------------------
# Unit tests — RandomX vectors via the interpreter path (release for speed)
# ---------------------------------------------------------------------------
rust:test:
  stage: test
  script:
    - cargo test --release
  timeout: 1h

# ---------------------------------------------------------------------------
# Release — on a `v*` tag, create a GitLab Release entry. The macOS arm64
# binary cannot be built on the shared Linux runners; it is built locally with
# `make dist` and attached to the release per RELEASING.md.
# ---------------------------------------------------------------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'MinerTim $CI_COMMIT_TAG'
    description: 'The macOS arm64 binary (minertim-<ver>-macos-arm64.tar.gz + SHA256SUMS) is built with `make dist` and attached manually — see RELEASING.md.'
