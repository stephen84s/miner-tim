stages:
  - check
  - build
  - test

variables:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"
  RUST_VERSION: "1.94.0"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

# ---------------------------------------------------------------------------
# Rust check — fast feedback on native code
# ---------------------------------------------------------------------------
rust:check:
  stage: check
  image: rust:${RUST_VERSION}
  before_script:
    - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    - cargo install cargo-ndk
  script:
    - cd app/src/main/rust
    - cargo check
    - cargo test
  cache:
    key: rust-${CI_COMMIT_REF_SLUG}
    paths:
      - app/src/main/rust/target/

# ---------------------------------------------------------------------------
# Android debug build — full APK with Rust cross-compilation
# ---------------------------------------------------------------------------
build:debug:
  stage: build
  image: thyrlian/android-sdk:latest
  before_script:
    # Install Rust
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    - cargo install cargo-ndk
    # Install Android SDK components
    - yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}"
        "platforms;android-${ANDROID_COMPILE_SDK}"
        "build-tools;${ANDROID_BUILD_TOOLS}"
        "ndk;${ANDROID_NDK_VERSION}" || true
    - export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
  script:
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 7 days
  cache:
    key: gradle-rust-${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/
      - app/src/main/rust/target/

# ---------------------------------------------------------------------------
# Android release build — unsigned release APK
# ---------------------------------------------------------------------------
build:release:
  stage: build
  image: thyrlian/android-sdk:latest
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    - cargo install cargo-ndk
    - yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}"
        "platforms;android-${ANDROID_COMPILE_SDK}"
        "build-tools;${ANDROID_BUILD_TOOLS}"
        "ndk;${ANDROID_NDK_VERSION}" || true
    - export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
  script:
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 30 days
  cache:
    key: gradle-rust-${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/
      - app/src/main/rust/target/
  only:
    - main
    - tags

# ---------------------------------------------------------------------------
# Unit tests
# ---------------------------------------------------------------------------
test:unit:
  stage: test
  image: thyrlian/android-sdk:latest
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    - cargo install cargo-ndk
    - yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}"
        "platforms;android-${ANDROID_COMPILE_SDK}"
        "build-tools;${ANDROID_BUILD_TOOLS}"
        "ndk;${ANDROID_NDK_VERSION}" || true
    - export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
  script:
    - ./gradlew test
  artifacts:
    when: always
    paths:
      - app/build/reports/tests/
    reports:
      junit: app/build/test-results/*/TEST-*.xml
    expire_in: 7 days
  cache:
    key: gradle-rust-${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/
      - app/src/main/rust/target/
