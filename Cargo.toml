[package]
name = "minertim"
version = "1.0.0"
edition = "2024"

[lib]
name = "minertim"
path = "src/lib.rs"

[[bin]]
name = "minertim"
path = "src/bin/minertim.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.29"
env_logger = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1.0"
ctrlc = "3.4"

[dev-dependencies]
# default-features off drops plotters/rayon/html-report — we only need timing.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "hash"
harness = false

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1

# Benchmarks compile in the `bench` profile; give them release-grade codegen
# so measurements reflect the real mining binary.
[profile.bench]
lto = true
opt-level = 3
codegen-units = 1
