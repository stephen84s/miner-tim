[package]
name = "minertim"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.29"
android_logger = "0.15.1"

[profile.release]
lto = true
opt-level = 3
strip = true
